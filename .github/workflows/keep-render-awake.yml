name: Keep Render service awake

on:
  schedule:
    # Render Free can sleep after roughly 15 minutes without inbound traffic.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            -H 'Cache-Control: no-cache' \
            https://telegrambotchat-chungkhoan.onrender.com/health)"
          echo "Render response: ${response}"
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<< "${response}"
