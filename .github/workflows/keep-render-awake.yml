name: Keep Render service awake

on:
  schedule:
    # Render Free can sleep after roughly 15 minutes without inbound traffic.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 30 \
            https://telegrambotchat-chungkhoan.onrender.com/health)"
          echo "Render response: ${response}"
          grep -q '"status":"ok"' <<< "${response}"
