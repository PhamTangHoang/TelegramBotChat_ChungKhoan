services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vn_stock}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/vn_stock}
      VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-kbs}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PUBLIC_ACCESS: ${TELEGRAM_PUBLIC_ACCESS:-false}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_RATE_LIMIT_PER_MIN: ${TELEGRAM_RATE_LIMIT_PER_MIN:-5}
      WATCHLIST_SYMBOLS: ${WATCHLIST_SYMBOLS:-FPT,VNM,HPG}
      WATCHLIST_EXCHANGES: ${WATCHLIST_EXCHANGES:-HOSE,HOSE,HOSE}
      MARKET_JOB_INTERVAL_MINUTES: ${MARKET_JOB_INTERVAL_MINUTES:-60}
      NEWS_JOB_INTERVAL_MINUTES: ${NEWS_JOB_INTERVAL_MINUTES:-45}
      NEWS_FEED_URLS: ${NEWS_FEED_URLS:-}
      NEWS_LOOKBACK_HOURS: ${NEWS_LOOKBACK_HOURS:-24}
      NEWS_MAX_ITEMS: ${NEWS_MAX_ITEMS:-10}
      NEWS_ALLOWED_DOMAINS: ${NEWS_ALLOWED_DOMAINS:-}
      EOD_SETTLE_JOB_TIME: ${EOD_SETTLE_JOB_TIME:-15:20}
      TELEGRAM_TIMEZONE: ${TELEGRAM_TIMEZONE:-Asia/Ho_Chi_Minh}
      VOLUME_LOOKBACK_DAYS: ${VOLUME_LOOKBACK_DAYS:-20}
      VOLUME_RATIO_THRESHOLD: ${VOLUME_RATIO_THRESHOLD:-1.5}
      VOLUME_MIN_ELAPSED_MINUTES: ${VOLUME_MIN_ELAPSED_MINUTES:-15}
      RS_LOOKBACK_DAYS: ${RS_LOOKBACK_DAYS:-20}
      DATA_CACHE_MAX_AGE_MINUTES: ${DATA_CACHE_MAX_AGE_MINUTES:-60}
      ALLOW_STALE_SIGNAL: ${ALLOW_STALE_SIGNAL:-false}
      RULE_VERSION: ${RULE_VERSION:-1.5.0}
      PP10_VERSION: ${PP10_VERSION:-1.0.0}
      PROMPT_VERSION: ${PROMPT_VERSION:-1.0.0}
      DATA_SCHEMA_VERSION: ${DATA_SCHEMA_VERSION:-1.0.0}
      CALENDAR_VERSION: ${CALENDAR_VERSION:-HOSE_2026}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
